[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "terraseek"
version = "0.1.0"
description = "TerraSeek: Satellite-imagery search and change-analysis platform"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "TerraSeek Team" },
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "geoalchemy2>=0.14.4",
    "shapely>=2.0.3",
    "pyproj>=3.6.1",
    "numpy>=1.26.4",
    "pillow>=10.2.0",
    "rasterio>=1.3.9",
    "qdrant-client>=1.8.0",
    "pyyaml>=6.0.1",
    "typer>=0.9.0",
    "rich>=13.7.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
]

[project.scripts]
terraseek = "terraseek.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/terraseek"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:.*BlockingPortal.*:DeprecationWarning",
    "ignore:.*testclient.*:Warning",
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

env: production
api:
  host: "0.0.0.0"
  port: 8000
  title: "TerraSeek API"
  version: "0.1.0"
  cors_origins:
    - "https://terraseek.internal"

database:
  url: "postgresql://terraseek:terraseek@postgis:5432/terraseek"
  sqlite_fallback_url: ""
  echo: false
  pool_size: 20
  max_overflow: 40

vector_db:
  url: "http://qdrant:6333"
  api_key: ""
  collection_name: "satellite_observations"
  embedding_dimension: 512
  prefer_in_memory: false

storage:
  root: "/data/storage"
  provider: "filesystem"

models:
  embedding_provider: "georsclip"
  change_provider: "unet_resnet34"
  cache_dir: "/data/models"

workers:
  poll_interval_seconds: 5
  max_concurrent_jobs: 8

logging:
  level: "INFO"
  format: "json"
